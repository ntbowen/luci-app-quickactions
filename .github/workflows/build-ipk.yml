name: Build IPK (OpenWrt 24.10)

on:
  push:
    branches: [main, separate-menus]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: luci-app-quickactions

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Download SDK 24.10
        run: |
          wget -q -O sdk.tar.zst "https://downloads.openwrt.org/releases/24.10.4/targets/x86/64/openwrt-sdk-24.10.4-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          tar --zstd -xvf sdk.tar.zst
          mv openwrt-sdk-* sdk
          echo "SDK_DIR=$PWD/sdk" >> $GITHUB_ENV

      - name: Build IPK
        run: |
          cp -r luci-app-quickactions/luci-app-quickactions "$SDK_DIR/package/luci-app-quickactions"
          cd "$SDK_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          echo "CONFIG_PACKAGE_luci-app-quickactions=m" >> .config
          make defconfig
          make package/luci-app-quickactions/compile V=s

      - name: Locate IPK
        run: find "$SDK_DIR/bin" -name "luci-app-quickactions*.ipk"

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ github.ref_name }}
          path: ${{ env.SDK_DIR }}/bin/packages/**/luci-app-quickactions*.ipk

      - name: Build rootfs tarball from IPK
        run: |
          set -e
          IPK=$(find "$SDK_DIR/bin" -name "luci-app-quickactions*.ipk" | head -1)
          [ -n "$IPK" ] || { echo "ERROR: no IPK found"; exit 1; }
          echo "Using IPK: $IPK"

          VERSION=$(awk -F':=' '/^PKG_VERSION:=/{gsub(/ /,"",$2); print $2}' \
              luci-app-quickactions/luci-app-quickactions/Makefile)
          RELEASE=$(awk -F':=' '/^PKG_RELEASE:=/{gsub(/ /,"",$2); print $2}' \
              luci-app-quickactions/luci-app-quickactions/Makefile)
          OUT="luci-app-quickactions-${VERSION}-r${RELEASE}-rootfs.tar.gz"
          echo "Output: $OUT"

          rm -rf /tmp/rootfs-extract
          mkdir -p /tmp/rootfs-extract
          tar xzf "$IPK" -C /tmp/rootfs-extract
          tar xzf /tmp/rootfs-extract/data.tar.gz -C /tmp/rootfs-extract
          rm -f /tmp/rootfs-extract/control.tar.gz \
                /tmp/rootfs-extract/data.tar.gz \
                /tmp/rootfs-extract/debian-binary

          tar czf "$OUT" -C /tmp/rootfs-extract .
          ls -la "$OUT"

      - name: Upload rootfs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-${{ github.ref_name }}
          path: luci-app-quickactions-*-rootfs.tar.gz

      - name: Create Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.SDK_DIR }}/bin/packages/**/luci-app-quickactions*.ipk
            luci-app-quickactions-*-rootfs.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
